{{- if .Values.tekton.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.tekton.serviceAccount }}
  namespace: {{ include "custom-workbench.rhoaiNamespace" . }}
  labels:
    app: {{ .Values.rhoai.imageName }}
    {{- include "custom-workbench.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
imagePullSecrets:
  - name: {{ .Values.secrets.internalRegistryPull.name }}
  - name: {{ .Values.secrets.redhatRegistryPull.name }}
---
# Pipeline tasks (buildah, oc import-image, etc.)
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.tekton.serviceAccount }}-edit
  namespace: {{ include "custom-workbench.rhoaiNamespace" . }}
  labels:
    app: {{ .Values.rhoai.imageName }}
    {{- include "custom-workbench.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
  - kind: ServiceAccount
    name: {{ .Values.tekton.serviceAccount }}
    namespace: {{ include "custom-workbench.rhoaiNamespace" . }}
{{- if .Values.tekton.eventListener.enabled }}
---
# EventListener: create PipelineRuns and read Trigger resources in-namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.tekton.serviceAccount }}-eventlistener
  namespace: {{ include "custom-workbench.rhoaiNamespace" . }}
  labels:
    app: {{ .Values.rhoai.imageName }}
    {{- include "custom-workbench.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekton-triggers-eventlistener-roles
subjects:
  - kind: ServiceAccount
    name: {{ .Values.tekton.serviceAccount }}
    namespace: {{ include "custom-workbench.rhoaiNamespace" . }}
---
# EventListener: read ClusterInterceptors and webhook secrets cluster-wide
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.tekton.serviceAccount }}-eventlistener-cluster
  labels:
    app: {{ .Values.rhoai.imageName }}
    {{- include "custom-workbench.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekton-triggers-eventlistener-clusterroles
subjects:
  - kind: ServiceAccount
    name: {{ .Values.tekton.serviceAccount }}
    namespace: {{ include "custom-workbench.rhoaiNamespace" . }}
{{- end }}
{{- end }}
