{{- if .Values.workbench.enabled }}
apiVersion: kubeflow.org/v1
kind: Notebook
metadata:
  name: {{ .Values.workbench.name }}
  namespace: {{ include "custom-workbench.workbenchNamespace" . }}
  labels:
    app: {{ .Values.workbench.name }}
    opendatahub.io/dashboard: "true"
    {{- include "custom-workbench.labels" . | nindent 4 }}
  annotations:
    notebooks.opendatahub.io/inject-oauth: "true"
    notebooks.opendatahub.io/last-image-selection: {{ include "custom-workbench.imageSelection" . | quote }}
    notebooks.opendatahub.io/last-image-version-git-commit-selection: {{ .Values.global.notebookBuildCommit | quote }}
    opendatahub.io/image-display-name: {{ .Values.workbench.imageDisplayName | quote }}
    opendatahub.io/hardware-profile-name: {{ .Values.workbench.hardwareProfile.name | quote }}
    opendatahub.io/hardware-profile-namespace: {{ .Values.workbench.hardwareProfile.namespace | quote }}
    openshift.io/display-name: {{ .Values.workbench.displayName | quote }}
    openshift.io/description: {{ .Values.workbench.description | quote }}
    {{- if .Values.workbench.podman.enabled }}
    # Documented intent; RHOAI does not propagate this to pods — see workbench-scc-patch-job.yaml
    openshift.io/required-scc: {{ .Values.workbench.podman.sccName | quote }}
    {{- end }}
    argocd.argoproj.io/sync-wave: "3"
spec:
  template:
    {{- if and .Values.workbench.podman.enabled .Values.workbench.podman.fuseDevice }}
    metadata:
      annotations:
        io.kubernetes.cri-o.Devices: /dev/fuse
    {{- end }}
    spec:
      {{- if .Values.workbench.podman.enabled }}
      hostUsers: false
      securityContext:
        runAsUser: {{ .Values.workbench.podman.runAsUser }}
        fsGroup: {{ .Values.workbench.podman.fsGroup }}
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
      {{- end }}
      volumes:
        - name: {{ .Values.workbench.name }}
          persistentVolumeClaim:
            claimName: {{ .Values.workbench.name }}
        - name: shm
          emptyDir:
            medium: Memory
      {{- if .Values.workbench.cloneRepos.enabled }}
      initContainers:
        - name: clone-repos
          image: {{ include "custom-workbench.internalWorkbenchImage" . }}
          imagePullPolicy: Always
          {{- if or (eq (include "custom-workbench.workbenchGitSecretEnabled" .) "true") (eq (include "custom-workbench.workbenchRegistryAuthEnabled" .) "true") }}
          env:
            {{- if eq (include "custom-workbench.workbenchGitSecretEnabled" .) "true" }}
            - name: GIT_CONFIG_GLOBAL
              value: /opt/app-root/src/.gitconfig
            - name: WORKBENCH_GIT_CREDENTIALS
              valueFrom:
                secretKeyRef:
                  name: {{ include "custom-workbench.workbenchGitSecret" . }}
                  key: .git-credentials
            - name: WORKBENCH_GITCONFIG
              valueFrom:
                secretKeyRef:
                  name: {{ include "custom-workbench.workbenchGitSecret" . }}
                  key: .gitconfig
            {{- end }}
            {{- if eq (include "custom-workbench.workbenchRegistryAuthEnabled" .) "true" }}
            - name: WORKBENCH_REGISTRY_AUTH_JSON
              valueFrom:
                secretKeyRef:
                  name: {{ include "custom-workbench.workbenchRegistryAuthSecret" . }}
                  key: .dockerconfigjson
            {{- end }}
          {{- end }}
          command:
            - /bin/bash
            - -lc
            - |
              set -euo pipefail
              {{- if .Values.workbench.podman.enabled }}
              WORKDIR_UID="$(id -u)"
              for rel in .config .local/share/containers; do
                target="/opt/app-root/src/${rel}"
                if [ -e "$target" ] && [ "$(stat -c '%u' "$target" 2>/dev/null || echo x)" != "${WORKDIR_UID}" ]; then
                  echo "Removing ${target} (owner mismatch for UID ${WORKDIR_UID})"
                  rm -rf "$target" || true
                fi
              done
              mkdir -p /opt/app-root/src/.config/containers \
                       /opt/app-root/src/.local/share/containers/storage
              if [ ! -w /opt/app-root/src/.local/share/containers/storage ]; then
                echo "Podman storage is not writable by UID ${WORKDIR_UID} (leftover root-owned dir)."
                echo "As cluster-admin: ./scripts/fix-workbench-podman-storage.sh"
              fi
              # vfs graphroot lives on the 20Gi PVC; leftover storage fills it and podman fails.
              avail_kb="$(df -P /opt/app-root/src | awk 'NR==2 { print $4 }')"
              if [ "${avail_kb:-0}" -lt 1048576 ]; then
                echo "PVC has <1Gi free (${avail_kb}K); removing leftover podman storage"
                rm -rf /opt/app-root/src/.local/share/containers || true
                mkdir -p /opt/app-root/src/.local/share/containers/storage
              fi
              {{- if eq (include "custom-workbench.workbenchRegistryAuthEnabled" .) "true" }}
              if [ -n "${WORKBENCH_REGISTRY_AUTH_JSON:-}" ]; then
                printf '%s' "${WORKBENCH_REGISTRY_AUTH_JSON}" > /opt/app-root/src/.config/containers/auth.json
                chmod 600 /opt/app-root/src/.config/containers/auth.json
              fi
              {{- end }}
              {{- end }}
              {{- if eq (include "custom-workbench.workbenchGitSecretEnabled" .) "true" }}
              mkdir -p /opt/app-root/src/.local
              rm -f /opt/app-root/src/.local/.git-credentials /opt/app-root/src/.gitconfig
              printf '%s' "${WORKBENCH_GIT_CREDENTIALS}" > /opt/app-root/src/.local/.git-credentials
              printf '%s' "${WORKBENCH_GITCONFIG}" > /opt/app-root/src/.gitconfig
              chmod 600 /opt/app-root/src/.local/.git-credentials /opt/app-root/src/.gitconfig
              # PVC clones may be owned by a previous OpenShift UID; git then refuses pull.
              git config --file /opt/app-root/src/.gitconfig --add safe.directory '*'
              {{- end }}
              {{- range .Values.workbench.cloneRepos.repos }}
              DEST="/opt/app-root/src/{{ .dir }}"
              if [ ! -d "${DEST}/.git" ]; then
                echo "Cloning {{ .dir }} (no .git present; replacing leftover tree)"
                rm -rf "${DEST}"
                git clone {{ include "custom-workbench.cloneRepoUrlFor" (dict "dir" .dir "url" .url "root" $) }} \
                  "${DEST}" || echo "git clone {{ .dir }} skipped"
              else
                echo "Updating {{ .dir }}"
                git -C "${DEST}" pull --ff-only || {
                  echo "{{ .dir }} not fast-forwardable; resetting to upstream"
                  git -C "${DEST}" fetch origin \
                    && git -C "${DEST}" reset --hard '@{upstream}' \
                    || echo "{{ .dir }} pull skipped"
                }
              fi
              {{- end }}
          volumeMounts:
            - mountPath: /opt/app-root/src
              name: {{ .Values.workbench.name }}
      {{- end }}
      containers:
        - name: {{ .Values.workbench.name }}
          image: {{ include "custom-workbench.internalWorkbenchImage" . }}
          imagePullPolicy: Always
          workingDir: /opt/app-root/src
          {{- if .Values.workbench.podman.enabled }}
          securityContext:
            allowPrivilegeEscalation: false
            procMount: Unmasked
          {{- end }}
          env:
            {{- if .Values.workbench.podman.enabled }}
            - name: CONTAINERS_STORAGE_CONF
              value: /etc/containers/workbench-storage.conf
            {{- if eq (include "custom-workbench.workbenchRegistryAuthEnabled" .) "true" }}
            - name: REGISTRY_AUTH_FILE
              value: /opt/app-root/src/.config/containers/auth.json
            {{- end }}
            {{- end }}
            - name: NOTEBOOK_ARGS
              value: |-
                --ServerApp.port=8888
                --ServerApp.token=''
                --ServerApp.password=''
                --ServerApp.base_url=/notebook/{{ .Values.workbench.namespace }}/{{ .Values.workbench.name }}
                --ServerApp.quit_button=False
            - name: JUPYTER_IMAGE
              value: {{ include "custom-workbench.internalWorkbenchImage" . }}
            {{- if eq (include "custom-workbench.workbenchGitSecretEnabled" .) "true" }}
            - name: GIT_CONFIG_GLOBAL
              value: /opt/app-root/src/.gitconfig
            {{- end }}
          ports:
            - containerPort: 8888
              name: notebook-port
              protocol: TCP
          resources:
            limits:
              cpu: {{ .Values.workbench.resources.limits.cpu | quote }}
              memory: {{ .Values.workbench.resources.limits.memory }}
            requests:
              cpu: {{ .Values.workbench.resources.requests.cpu | quote }}
              memory: {{ .Values.workbench.resources.requests.memory }}
          volumeMounts:
            - mountPath: /opt/app-root/src
              name: {{ .Values.workbench.name }}
            - mountPath: /dev/shm
              name: shm
      enableServiceLinks: false
      serviceAccountName: {{ .Values.workbench.name }}
{{- end }}
