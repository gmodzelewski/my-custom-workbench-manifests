{{- if .Values.workbench.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.workbench.name }}
  namespace: {{ include "custom-workbench.workbenchNamespace" . }}
  labels:
    opendatahub.io/dashboard: "true"
    {{- include "custom-workbench.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
{{- if and .Values.workbench.enabled .Values.workbench.podman.enabled .Values.workbench.podman.sccClusterRole }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.workbench.name }}-podman-scc
  namespace: {{ include "custom-workbench.workbenchNamespace" . }}
  labels:
    {{- include "custom-workbench.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.workbench.podman.sccClusterRole }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.workbench.name }}
    namespace: {{ include "custom-workbench.workbenchNamespace" . }}
{{- end }}
{{- end }}
