apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: custom-workbench
  namespace: openshift-gitops
spec:
  generators:
    - list:
        elements:
          - name: in-cluster
            server: https://kubernetes.default.svc
  template:
    metadata:
      name: custom-workbench-{{name}}
    spec:
      project: default
      source:
        repoURL: https://github.com/gmodzelewski/my-custom-workbench-manifests.git
        targetRevision: main
        path: charts/custom-workbench
        helm:
          releaseName: custom-workbench
          valueFiles:
            - values.yaml
      destination:
        server: "{{server}}"
        namespace: redhat-ods-applications
      ignoreDifferences:
        # OpenShift injects a dockercfg pull secret on ServiceAccounts
        - kind: ServiceAccount
          jqPathExpressions:
            - .imagePullSecrets
            - .secrets
            - .metadata.annotations["openshift.io/internal-registry-pull-secret-ref"]
        # RHOAI notebook controller merges oauth proxy, CA bundles, platform volumes,
        # normalizes initContainers (field order, resources: {}), and strips pod template metadata.
        # openshift.io/required-scc is applied via PostSync Job on the StatefulSet (see workbench-scc-patch-job.yaml).
        - group: kubeflow.org
          kind: Notebook
          jqPathExpressions:
            - .spec.template.metadata
            - .spec.template.spec.containers
            - .spec.template.spec.initContainers
            - .spec.template.spec.volumes
            - .metadata.annotations
            - .metadata.finalizers
            - .metadata.labels
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
