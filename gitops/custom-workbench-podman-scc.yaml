# Minimum SCC for in-workbench podman/buildah (UID 1001).
# The workbench image uses userns=host + BUILDAH_ISOLATION=chroot, so nested
# user namespaces (newuidmap / /etc/subuid) are not required.
# SETUID/SETGID and SCC-level allowPrivilegeEscalation are leftover for that
# unused nested-userns path and can be dropped as a follow-up.
# Apply: ./scripts/bootstrap-workbench-podman-scc.sh
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: custom-workbench-podman
  annotations:
    kubernetes.io/description: >-
      Workbench Podman (UID 1001). Image default is userns=host + chroot;
      SETUID/SETGID remain until a follow-up drops nested-userns leftovers.
      No privileged containers or host access.
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
allowPrivilegeEscalation: true
allowPrivilegedContainer: false
allowedCapabilities:
  - SETUID
  - SETGID
defaultAddCapabilities: null
fsGroup:
  type: RunAsAny
groups: []
priority: 10
readOnlyRootFilesystem: false
requiredDropCapabilities:
  - KILL
  - MKNOD
runAsUser:
  type: MustRunAs
  uid: 1001
seLinuxContext:
  type: MustRunAs
supplementalGroups:
  type: RunAsAny
users: []
volumes:
  - configMap
  - csi
  - downwardAPI
  - emptyDir
  - ephemeral
  - image
  - persistentVolumeClaim
  - projected
  - secret
