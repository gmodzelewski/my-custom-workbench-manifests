# Fallback SCC for in-workbench podman on OCP < 4.20 (no built-in nested-container).
# On OCP 4.20+, prefer nested-container via workbench.podman.sccName and bootstrap-workbench-podman-scc.sh.
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: custom-workbench-podman
  annotations:
    kubernetes.io/description: >-
      Workbench Podman (UID 1001). Image default is userns=host + chroot.
      No privileged containers or host access.
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
allowPrivilegeEscalation: true
allowPrivilegedContainer: false
allowedCapabilities:
  - SETUID
  - SETGID
defaultAddCapabilities: null
fsGroup:
  type: RunAsAny
groups: []
priority: 10
readOnlyRootFilesystem: false
requiredDropCapabilities:
  - KILL
  - MKNOD
runAsUser:
  type: MustRunAs
  uid: 1001
seLinuxContext:
  type: MustRunAs
supplementalGroups:
  type: RunAsAny
users: []
volumes:
  - configMap
  - csi
  - downwardAPI
  - emptyDir
  - ephemeral
  - image
  - persistentVolumeClaim
  - projected
  - secret
