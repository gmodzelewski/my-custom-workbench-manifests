# Cluster-admin bootstrap only — NOT managed by Argo CD (no cluster-scoped patch RBAC).
# Apply: ./scripts/bootstrap-workbench-podman-scc.sh
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: custom-workbench-podman
  annotations:
    kubernetes.io/description: >-
      Minimum OpenShift SCC for rootless podman/buildah in the custom workbench
      (UID 1001, user namespaces). Allows SETUID/SETGID only; no privileged
      containers or host access. SCC-level allowPrivilegeEscalation is required
      for newuidmap; the workbench container sets allowPrivilegeEscalation false.
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
allowPrivilegeEscalation: true
allowPrivilegedContainer: false
allowedCapabilities:
  - SETUID
  - SETGID
defaultAddCapabilities: null
fsGroup:
  type: RunAsAny
groups: []
priority: 10
readOnlyRootFilesystem: false
requiredDropCapabilities:
  - KILL
  - MKNOD
runAsUser:
  type: MustRunAs
  uid: 1001
seLinuxContext:
  type: MustRunAs
supplementalGroups:
  type: RunAsAny
users: []
volumes:
  - configMap
  - csi
  - downwardAPI
  - emptyDir
  - ephemeral
  - image
  - persistentVolumeClaim
  - projected
  - secret
