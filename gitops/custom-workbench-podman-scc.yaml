# Minimum SCC for in-workbench podman/buildah (UID 1001).
# The workbench image uses userns=host + BUILDAH_ISOLATION=chroot, so nested
# user namespaces (newuidmap / /etc/subuid) are not required.
# SETUID/SETGID are still required: Buildah chroot RUN steps call setgroups()
# (fixed in Buildah 1.45; UBI9 Podman 5.8.2 still does it).
# Apply: ./scripts/bootstrap-workbench-podman-scc.sh
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: custom-workbench-podman
  annotations:
    kubernetes.io/description: >-
      Workbench Podman (UID 1001). Image default is userns=host + chroot.
      SETUID/SETGID let Buildah chroot RUN steps call setgroups().
      No privileged containers or host access.
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
allowPrivilegeEscalation: true
allowPrivilegedContainer: false
allowedCapabilities:
  - SETUID
  - SETGID
defaultAddCapabilities: null
fsGroup:
  type: RunAsAny
groups: []
priority: 10
readOnlyRootFilesystem: false
requiredDropCapabilities:
  - KILL
  - MKNOD
runAsUser:
  type: MustRunAs
  uid: 1001
seLinuxContext:
  type: MustRunAs
supplementalGroups:
  type: RunAsAny
users: []
volumes:
  - configMap
  - csi
  - downwardAPI
  - emptyDir
  - ephemeral
  - image
  - persistentVolumeClaim
  - projected
  - secret
